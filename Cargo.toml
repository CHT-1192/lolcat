[package]
name = "lolcat"
version = "100.0.2"
edition = "2021"
description = "Rainbow coloring effect for text console display (Rust port of busyloop/lolcat)"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
jsonc-parser = "0.33.1"
libc = "0.2"
rand = "0.9"
unicode-width = "0.2.2"

[profile.release]
lto = true
strip = true
